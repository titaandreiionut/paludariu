plugins {
    id 'com.android.application'
}

android {
    namespace 'ro.paludariu.app'
    compileSdk 34

    defaultConfig {
        applicationId 'ro.paludariu.app'
        minSdk 24
        targetSdk 34
        versionCode 19
        versionName '1.8.9'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
